<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f3e8ff;
    }

    .kutu {
      background: white;
      padding: 35px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 20px rgba(128,0,128,0.25);
      border-top: 6px solid #7b2cbf;
    }

    h1 {
      color: #7b2cbf;
      margin-bottom: 10px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #7b2cbf;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #5a189a;
    }

    .hata {
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }

    .iletisim {
      margin-top: 20px;
      font-size: 13px;
      color: #444;
    }

    .iletisim strong {
      display: block;
      margin-top: 5px;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="kutu">
    <h1>SOLVER ARGE</h1>
    <p>Şifre giriniz</p>

    <input type="password" id="sifre" placeholder="Şifre">
    <button onclick="kontrol()">Giriş</button>

    <div class="hata" id="mesaj"></div>

    <div class="iletisim">
      Şifre almak için iletişime geçebilirsiniz
      <strong>Kurucu Doç. Dr. Şükrü Önalan<br>0530 963 9617</strong>
    </div>
  </div>

  <script>
    function kontrol() {
      const dogruSifre = "1234";
      const girilen = document.getElementById("sifre").value;

      if (girilen === dogruSifre) {
        window.location.href = "icerik.html";
      } else {
        document.getElementById("mesaj").innerText = "Şifre yanlış";
      }
    }
  </script>

</body>
</html>
